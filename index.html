<!doctype html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impiccato</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <h1 class="text-center mb-4">Gioco dell'Impiccato</h1>

    <div class="text-center mb-3">
        <img id="hangman-img" src="" width="250">
    </div>

    <div id="word" class="text-center mb-4"></div>

    <div id="message" class="text-center fs-4 mb-3"></div>

    <div id="keyboard" class="text-center mb-4">
        <div class="mb-2">
            <button class="key btn btn-outline-secondary m-1">Q</button>
            <button class="key btn btn-outline-secondary m-1">W</button>
            <button class="key btn btn-outline-secondary m-1">E</button>
            <button class="key btn btn-outline-secondary m-1">R</button>
            <button class="key btn btn-outline-secondary m-1">T</button>
            <button class="key btn btn-outline-secondary m-1">Y</button>
            <button class="key btn btn-outline-secondary m-1">U</button>
            <button class="key btn btn-outline-secondary m-1">I</button>
            <button class="key btn btn-outline-secondary m-1">O</button>
            <button class="key btn btn-outline-secondary m-1">P</button>
        </div>

        <div class="mb-2">
            <button class="key btn btn-outline-secondary m-1">A</button>
            <button class="key btn btn-outline-secondary m-1">S</button>
            <button class="key btn btn-outline-secondary m-1">D</button>
            <button class="key btn btn-outline-secondary m-1">F</button>
            <button class="key btn btn-outline-secondary m-1">G</button>
            <button class="key btn btn-outline-secondary m-1">H</button>
            <button class="key btn btn-outline-secondary m-1">J</button>
            <button class="key btn btn-outline-secondary m-1">K</button>
            <button class="key btn btn-outline-secondary m-1">L</button>
        </div>

        <div>
            <button class="key btn btn-outline-secondary m-1">Z</button>
            <button class="key btn btn-outline-secondary m-1">X</button>
            <button class="key btn btn-outline-secondary m-1">C</button>
            <button class="key btn btn-outline-secondary m-1">V</button>
            <button class="key btn btn-outline-secondary m-1">B</button>
            <button class="key btn btn-outline-secondary m-1">N</button>
            <button class="key btn btn-outline-secondary m-1">M</button>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
